services:
  # PostgreSQL database with PostGIS extension
  db:
    image: postgis/postgis:15-3.3
    container_name: land_contract_db
    environment:
      POSTGRES_DB: ${DB_NAME:-land_contract_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - land_contract_network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$${POSTGRES_PASSWORD} pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    container_name: land_contract_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - land_contract_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django backend application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: land_contract_backend
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=core.settings.production
      - ALLOWED_HOSTS=*
      - SECRET_KEY=django-insecure-super-secret-key-20260223-landdeal
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-land_contract_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - EMAIL_HOST=localhost
      - EMAIL_PORT=587
      - EMAIL_USE_TLS=True
      - EMAIL_HOST_USER=noreply@landcontracts.ru
      - EMAIL_HOST_PASSWORD=secret
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_STORAGE_BUCKET_NAME=dummy
      - AWS_S3_REGION_NAME=eu-central-1
      - USE_S3_STORAGE=False
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
      - log_files:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - land_contract_network
    command: >
      sh -c "python manage.py migrate contenttypes &&
             python manage.py migrate auth &&
             python manage.py migrate --run-syncdb &&
             python manage.py seed_test_users &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 core.wsgi:application"

  # React frontend application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: land_contract_frontend
    ports:
      - "3000:80"
    volumes:
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    depends_on:
      - backend
    networks:
      - land_contract_network

  # Nginx reverse proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: land_contract_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_files:/var/www/static
      - media_files:/var/www/media
    depends_on:
      - backend
      - frontend
    networks:
      - land_contract_network

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
  log_files:

networks:
  land_contract_network:
    driver: bridge
